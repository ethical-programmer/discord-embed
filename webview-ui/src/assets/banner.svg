<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0D0F2E"/>
      <stop offset="1" stop-color="#1C1142"/>
    </linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="60"/>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0v40" fill="none" stroke="#fff" stroke-opacity=".05"/>
    </pattern>
    <linearGradient id="title" x1="0" x2="1">
      <stop offset="0" stop-color="#fff"/>
      <stop offset="1" stop-color="#C9CDFF"/>
    </linearGradient>
    <linearGradient id="pill" x1="0" x2="1">
      <stop offset="0" stop-color="#5865F2"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" x2="1">
      <stop offset=".35" stop-color="#0D0F2E" stop-opacity=".85"/>
      <stop offset=".7" stop-color="#0D0F2E" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="400" fill="url(#bg)"/>
  <g filter="url(#blur)">
    <circle cx="190" cy="70" r="160" fill="#5865F2" opacity=".75"/>
    <circle cx="830" cy="340" r="180" fill="#EB459E" opacity=".55"/>
    <circle cx="660" cy="30" r="130" fill="#8B5CF6" opacity=".6"/>
  </g>
  <rect width="1000" height="400" fill="url(#grid)"/>

  <g transform="translate(640 96) rotate(-7)">
    <rect width="270" height="170" rx="22" fill="#fff" fill-opacity=".07" stroke="#fff" stroke-opacity=".18"/>
    <rect x="22" y="24" width="5" height="122" rx="2.5" fill="#5865F2"/>
    <circle cx="56" cy="40" r="12" fill="#7C8CFF"/>
    <rect x="76" y="34" width="110" height="12" rx="6" fill="#fff" fill-opacity=".75"/>
    <rect x="44" y="66" width="200" height="9" rx="4.5" fill="#fff" fill-opacity=".3"/>
    <rect x="44" y="83" width="170" height="9" rx="4.5" fill="#fff" fill-opacity=".3"/>
    <rect x="44" y="114" width="78" height="30" rx="9" fill="#5865F2"/>
    <rect x="130" y="114" width="78" height="30" rx="9" fill="#fff" fill-opacity=".16"/>
  </g>
  <g transform="translate(860 64) rotate(12)">
    <rect width="72" height="72" rx="20" fill="#fff" fill-opacity=".1" stroke="#fff" stroke-opacity=".2"/>
    <path d="M36 16c1.5 11 7 17 19 20-12 3-17.5 9-19 20-1.5-11-7-17-19-20 12-3 17.5-9 19-20Z" fill="#FFD479"/>
  </g>

  <rect width="1000" height="400" fill="url(#fade)"/>

  <g transform="translate(72 0)" font-family="Segoe UI Variable Display, Segoe UI, -apple-system, Helvetica, Arial, sans-serif">
    <rect y="104" width="156" height="32" rx="16" fill="url(#pill)"/>
    <text x="78" y="125.5" text-anchor="middle" font-size="13" font-weight="700" letter-spacing="2.4" fill="#fff">NEW SEASON</text>
    <text y="202" font-size="56" font-weight="800" fill="url(#title)">Welcome to the</text>
    <text y="264" font-size="56" font-weight="800" fill="url(#title)">community</text>
    <text y="308" font-size="20" fill="#fff" fill-opacity=".68">Events, giveaways and updates, all in one place.</text>
  </g>
</svg>
